<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · 演示站合集</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">◆ 演示站合集 / 管理后台</a><div class="top-actions"><a class="top-link" href="/">返回首页</a></div></header><main id="login" class="login-screen"><div class="login-box"><div class="brand-mark">◆</div><h2>管理后台登录</h2><p class="muted">请输入管理员密码</p><form id="loginForm"><input class="field" type="password" id="password" placeholder="管理员密码" required autocomplete="current-password"><button class="btn" style="width:100%">登录后台</button></form><p id="loginError" class="muted"></p></div></main><main id="admin" class="admin-wrap hidden"><section class="panel admin-top"><div><h2 style="margin:0 0 6px">站点管理</h2><span class="muted" id="summary">正在加载…</span></div><div class="actions"><button class="btn" id="add">＋ 新增站点</button><button class="btn" id="check">一键检测存活</button><button class="btn secondary" id="export">导出 JSON</button><label class="btn secondary" for="importFile">导入数据</label><input id="importFile" type="file" accept=".json,application/json" hidden><button class="btn secondary" id="logout">退出</button></div></section><section class="panel"><div class="admin-top"><b>显示设置</b><label class="muted">首页每页数量 <select id="pageSize" class="field"><option>12</option><option>24</option><option>48</option><option>72</option><option>96</option></select></label></div></section><section class="panel"><h3 style="margin-top:0">页面内容管理</h3><p class="muted">固定管理「工具」和「联系我们」两个页面，不会创建文章列表。</p><form id="pagesForm" class="form-grid"><label>工具页面标题<input class="field" name="tools_title" maxlength="100" required></label><label>联系我们页面标题<input class="field" name="contact_title" maxlength="100" required></label><label class="wide">工具页面正文 <span class="muted">可视化编辑：标题、文字、图片、链接、表格</span><textarea id="toolsEditor" class="field rich-editor" name="tools_content"></textarea></label><label class="wide">联系我们页面正文 <span class="muted">可视化编辑：标题、文字、图片、链接、表格</span><textarea id="contactEditor" class="field rich-editor" name="contact_content"></textarea></label><div class="wide actions"><button class="btn" type="submit">保存两个页面</button></div></form></section><section class="panel"><div class="table-scroll"><table class="admin-table"><thead><tr><th>站点名称</th><th>分类</th><th>状态</th><th>浏览量</th><th>最近检测时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel hidden" id="editor"><h3 id="editorTitle">新增站点</h3><form id="siteForm" class="form-grid"><input type="hidden" name="id"><label>站点名称 *<input class="field" name="name" required></label><label>演示站网址 *<input class="field" name="url" type="url" required placeholder="https://example.com"></label><label>分类<input class="field" name="category" value="其他"></label><label>封面图片 URL<input class="field" name="cover" type="url"></label><label>演示账号<input class="field" name="demo_user"></label><label>演示密码<input class="field" name="demo_password"></label><label>源码地址<input class="field" name="source_url" type="url"></label><label class="wide">功能说明<input class="field" name="features"></label><label class="wide">项目简介<textarea class="field" name="description" rows="3"></textarea></label><div class="wide actions"><button class="btn">保存站点</button><button type="button" class="btn secondary" id="cancel">取消</button></div></form></section><p class="muted">安全提示：不要在演示站中放置真实账号密码；请使用专用演示账号。</p></main><div id="toastRoot"></div><script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js" referrerpolicy="origin"></script><script src="/admin.js"></script></body></html>
