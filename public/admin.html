<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · 演示站合集</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">◆ 演示站合集 / 管理后台</a><div class="top-actions"><a class="top-link" href="/">返回首页</a></div></header><main id="login" class="login-screen"><div class="login-box"><div class="brand-mark">◆</div><h2>管理后台登录</h2><p class="muted">请输入管理员密码</p><form id="loginForm"><input class="field" type="password" id="password" placeholder="管理员密码" required autocomplete="current-password"><button class="btn" style="width:100%">登录后台</button></form><p id="loginError" class="muted"></p></div></main><main id="admin" class="admin-wrap hidden"><section class="panel admin-top"><div><h2 style="margin:0 0 6px">站点管理</h2><span class="muted" id="summary">正在加载…</span></div><div class="actions"><button class="btn" id="add">＋ 新增站点</button><button class="btn" id="check">一键检测存活</button><button class="btn secondary" id="export">导出 JSON</button><label class="btn secondary" for="importFile">导入数据</label><input id="importFile" type="file" accept=".json,application/json" hidden><button class="btn secondary" id="logout">退出</button></div></section><section class="panel"><div class="admin-top"><b>显示设置</b><label class="muted">首页每页数量 <select id="pageSize" class="field"><option>12</option><option>24</option><option>48</option><option>72</option><option>96</option></select></label></div></section><section class="panel"><h3 style="margin-top:0">联系方式设置</h3><p class="muted">保存后，首页右上角「联系我」会显示以下内容；留空的项目会显示“暂未填写”。</p><form id="contactForm" class="form-grid"><label>微信<input class="field" name="contact_wechat" maxlength="200" placeholder="填写微信号"></label><label>QQ<input class="field" name="contact_qq" maxlength="200" placeholder="填写 QQ 号"></label><label class="wide">邮箱<input class="field" name="contact_email" type="email" maxlength="200" placeholder="name@example.com"></label><div class="wide actions"><button class="btn" type="submit">保存联系方式</button></div></form></section><section class="panel">
<h3 style="margin-top:0">安全设置 · 修改管理员密码</h3>
<p class="muted">修改后新密码立即生效，其他已登录会话将失效，请妥善保管新密码。</p>
<form id="passwordForm" class="form-grid">
<label>当前管理员密码<input class="field" name="current_password" type="password" required autocomplete="current-password"></label>
<label>新管理员密码<input class="field" name="new_password" type="password" required minlength="8" autocomplete="new-password"></label>
<div class="wide actions"><button class="btn" type="submit">修改管理员密码</button></div>
</form>
</section>
<section class="panel" id="articleManager"><div class="admin-top"><div><h3 style="margin:0 0 6px">文章管理 · SEO 内容</h3><span class="muted">发布后生成可被搜索引擎抓取的独立文章页</span></div><button class="btn" id="articleAdd">＋ 新增文章</button></div><div class="table-scroll" style="margin-top:16px"><table class="admin-table"><thead><tr><th>文章标题</th><th>网址</th><th>状态</th><th>操作</th></tr></thead><tbody id="articleRows"><tr><td colspan="4">正在加载…</td></tr></tbody></table></div><section id="articleEditor" class="hidden" style="margin-top:20px;padding-top:18px;border-top:1px solid #294866"><h3 id="articleEditorTitle">新增文章</h3><form id="articleForm" class="form-grid"><input type="hidden" name="id"><label>文章标题 *<input class="field" name="title" required maxlength="200"></label><label>网址别名（slug）*<input class="field" name="slug" required placeholder="例如：site-guide"></label><label class="wide">文章摘要<textarea class="field" name="summary" rows="2" maxlength="500"></textarea></label><label class="wide">正文 *<textarea class="field" name="content" rows="10" required placeholder="每段之间空一行。支持纯文本段落。"></textarea></label><label class="wide">封面图片 URL<input class="field" name="cover" type="url"></label><label>SEO 标题<input class="field" name="seo_title" maxlength="200"></label><label>SEO 描述<input class="field" name="seo_description" maxlength="500"></label><label class="wide">SEO 关键词<input class="field" name="seo_keywords" maxlength="500"></label><label class="wide">Canonical 规范网址（可留空）<input class="field" name="canonical" type="url"></label><label>发布状态<select class="field" name="status"><option value="draft">草稿</option><option value="published">发布</option></select></label><div class="wide actions"><button class="btn" type="submit">保存文章</button><button class="btn secondary" type="button" id="articleCancel">取消</button></div></form></section></section><section class="panel"><div class="table-scroll"><table class="admin-table"><thead><tr><th>站点名称</th><th>分类</th><th>状态</th><th>最近检测时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel hidden" id="editor"><h3 id="editorTitle">新增站点</h3><form id="siteForm" class="form-grid"><input type="hidden" name="id"><label>站点名称 *<input class="field" name="name" required></label><label>演示站网址 *<input class="field" name="url" type="url" required placeholder="https://example.com"></label><label>分类<input class="field" name="category" value="其他"></label><label>封面图片 URL<input class="field" name="cover" type="url"></label><label>演示账号<input class="field" name="demo_user"></label><label>演示密码<input class="field" name="demo_password"></label><label>源码地址<input class="field" name="source_url" type="url"></label><label class="wide">功能说明<input class="field" name="features"></label><label class="wide">项目简介<textarea class="field" name="description" rows="3"></textarea></label><div class="wide actions"><button class="btn">保存站点</button><button type="button" class="btn secondary" id="cancel">取消</button></div></form></section><p class="muted">安全提示：不要在演示站中放置真实账号密码；请使用专用演示账号。</p></main><div id="toastRoot"></div><script src="/admin.js"></script></body></html>
