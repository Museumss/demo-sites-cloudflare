name = "demo-sites-cloudflare"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "demo-sites-cloudflare-db"
database_id = "98068b04-8d21-4328-b6a2-bc75751f25b3"

[triggers]
# 每12小时执行一次（UTC）
crons = ["0 */12 * * *"]

[vars]
ENVIRONMENT = "production"
